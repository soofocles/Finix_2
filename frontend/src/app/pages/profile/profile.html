<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">

        <!-- ===== SIDEBAR ===== -->
        <nav class="col-md-2 sidebar d-flex flex-column p-4">
            <div class="d-flex align-items-center mb-5 brand-logo">
                <i class="bi bi-play-circle-fill fs-3 me-2 text-white"></i>
                <span class="fs-4 fw-bold text-white">Finix</span>
            </div>

            <p class="text-white-50 text-uppercase small mb-3 fw-semibold">Menu</p>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" class="nav-link text-white-50 hover-link">
                        <i class="bi bi-house-door me-3 fs-5"></i> Inicio
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a routerLink="/reports" routerLinkActive="active-link" class="nav-link text-white-50 hover-link">
                        <i class="bi bi-bar-chart-line me-3 fs-5"></i> Reportes
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a routerLink="/data-entry" routerLinkActive="active-link" class="nav-link text-white-50 hover-link">
                        <i class="bi bi-table me-3 fs-5"></i> Mis Datos
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a routerLink="/profile" routerLinkActive="active-link" class="nav-link text-white active-link">
                        <i class="bi bi-gear me-3 fs-5"></i> Configuración
                    </a>
                </li>
            </ul>

            <button class="btn btn-outline-light mt-5 w-100 rounded-pill" routerLink="/login">
                <i class="bi bi-box-arrow-left me-2"></i> Cerrar sesión
            </button>
        </nav>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="col-md-10 px-5 py-4 bg-white center-panel" style="border-radius: 40px 0 0 40px;">
            
            <div class="mb-5 d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold">Configuración de Perfil ⚙️</h3>
                    <p class="text-muted small">Actualiza tu información personal y de seguridad.</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <img src="https://ui-avatars.com/api/?name=U+F&background=4c3cfa&color=fff" class="rounded-circle" width="50" height="50">
                    <div>
                        <h6 class="mb-0 fw-bold">Usuario Finix</h6>
                        <small class="text-muted">usuario@correo.com</small>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Información Personal -->
                <div class="col-md-6">
                    <div class="p-4 rounded-4 border bg-white shadow-sm h-100">
                        <h5 class="fw-bold mb-4 d-flex align-items-center">
                            <i class="bi bi-person-badge text-primary me-2"></i> Información Personal
                        </h5>
                        
                        <form>
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label small fw-semibold text-muted">Nombre</label>
                                    <input type="text" class="form-control" value="Usuario" placeholder="Tu nombre">
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label small fw-semibold text-muted">Apellido</label>
                                    <input type="text" class="form-control" value="Finix" placeholder="Tu apellido">
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold text-muted">Correo Electrónico</label>
                                    <input type="email" class="form-control" value="usuario@correo.com" placeholder="ejemplo@correo.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold text-muted">Moneda Principal</label>
                                    <select class="form-select">
                                        <option value="USD">USD ($)</option>
                                        <option value="EUR">EUR (€)</option>
                                        <option value="COP">COP ($)</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="button" class="btn btn-primary px-4 py-2 rounded-3 w-100 fw-bold">
                                        Guardar Cambios
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Seguridad -->
                <div class="col-md-6">
                    <div class="p-4 rounded-4 border bg-white shadow-sm h-100">
                        <h5 class="fw-bold mb-4 d-flex align-items-center">
                            <i class="bi bi-shield-lock text-danger me-2"></i> Seguridad y Contraseña
                        </h5>
                        
                        <form>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label small fw-semibold text-muted">Contraseña Actual</label>
                                    <input type="password" class="form-control" placeholder="••••••••">
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold text-muted">Nueva Contraseña</label>
                                    <input type="password" class="form-control" placeholder="••••••••">
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold text-muted">Confirmar Nueva Contraseña</label>
                                    <input type="password" class="form-control" placeholder="••••••••">
                                </div>
                                
                                <div class="col-12 mt-4">
                                    <button type="button" class="btn btn-outline-danger px-4 py-2 rounded-3 w-100 fw-bold">
                                        Actualizar Contraseña
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
